[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-cleanup"
version = "1.0.0"
description = "Bersihkan file CSV yang berantakan: buang duplikat, rapikan spasi, normalkan nilai kosong."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Dani Noar" }]
keywords = ["csv", "clean", "cleanup", "data", "cli", "dedupe", "messy-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Environment :: Console",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[project.scripts]
csv-cleanup = "csv_cleanup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]